# SonarQube configuration for the Task Manager React frontend (full-stack/root repo).
# Placement: repository root of the frontend project
#   (full-stack-task-and-note-manager-348702/react_frontend/sonar-project.properties).
# Run from this same directory so coverage/lcov.info is discovered at ./coverage/lcov.info.

sonar.projectKey=task-manager-frontend
sonar.projectName=Task Manager Frontend
sonar.projectVersion=1.0.0

sonar.sourceEncoding=UTF-8

# Source and test layout
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx

# Coverage: Jest writes LCOV to coverage/lcov.info (coverageReporters includes "lcov").
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions for build outputs, dependencies, and test files
sonar.exclusions=node_modules/**,dist/**,build/**,coverage/**,**/*.test.js,**/*.test.jsx
sonar.coverage.exclusions=src/main.jsx,src/setupTests.js,**/*.test.js,**/*.test.jsx
